name: Build Blender Linux ARM64 (CPU/Vulkan/OpenGL)
run-name: Blender ${{ inputs.blender_version || 'latest stable' }} — Linux ARM64 CPU/Vulkan/OpenGL

on:
  workflow_dispatch:
    inputs:
      blender_version:
        description: 'Stable Blender version (blank selects the newest stable tag)'
        required: false
        type: string
      dependency_ref:
        description: 'Optional official ARM64 library commit/branch override'
        required: false
        type: string
      build_jobs:
        description: 'Parallel compile jobs'
        required: true
        type: choice
        options:
          - '2'
          - '4'
          - '6'
        default: '4'
      mesa_ppa:
        description: 'Mesa PPA to try (blank uses the Ubuntu archive)'
        required: false
        default: ppa:kisak/kisak-mesa
        type: string
      publish_release:
        description: 'Publish a GitHub Release after all checks pass'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: blender-linux-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      CC: clang-21
      CXX: clang++-21
      LD: ld.lld-21
      AR: llvm-ar-21
      RANLIB: llvm-ranlib-21
      BLENDER_VERSION: ${{ inputs.blender_version }}
      BLENDER_DEPENDENCY_REF: ${{ inputs.dependency_ref }}
      BLENDER_BUILD_JOBS: ${{ inputs.build_jobs }}
      BLENDER_CPU_FLAGS: '-mcpu=cortex-x4+nosve+nosve2'
      BLENDER_OPTIMIZATION_FLAG: -O3
      BLENDER_PACKAGE_REVISION: ${{ github.run_number }}
      MESA_PPA: ${{ inputs.mesa_ppa }}
      BLENDER_PROOT_COMPAT: '1'
      BLENDER_FREEDRENO_COMPAT: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'

    steps:
      - name: Check out build recipe
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare runner paths and disk
        run: |
          echo "BLENDER_INSTALL_DIR=$RUNNER_TEMP/blender-install" >> "$GITHUB_ENV"
          echo "BLENDER_BUILD_DIR=$RUNNER_TEMP/blender-build" >> "$GITHUB_ENV"
          df -h .
          free -h || true
          uname -a
          nproc
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h .

      - name: Install Clang 21 and Mesa Freedreno/Turnip runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          if [[ -n "$MESA_PPA" ]]; then
            if sudo add-apt-repository -y "$MESA_PPA" && sudo apt-get update; then
              echo "MESA_PPA_USED=$MESA_PPA" >> "$GITHUB_ENV"
            else
              echo "::warning::Could not enable $MESA_PPA; using the Ubuntu archive Mesa."
              sudo add-apt-repository -r -y "$MESA_PPA" 2>/dev/null || true
              sudo apt-get update 2>/dev/null || true
            fi
          fi
          sudo apt-get install -y \
            git git-lfs cmake ninja-build build-essential pkg-config binutils desktop-file-utils \
            clang-21 lld-21 llvm-21 libclang-rt-21-dev python3 python3-dev xz-utils \
            libx11-dev libxxf86vm-dev libxi-dev libxfixes-dev libxrender-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libegl-dev libegl1-mesa-dev \
            libwayland-dev libdecor-0-dev libdbus-1-dev libxkbcommon-dev \
            libsm-dev libice-dev libvulkan-dev vulkan-tools \
            libpulse-dev libjack-jackd2-dev libasound2-dev \
            mesa-vulkan-drivers libgl1-mesa-dri libegl-mesa0 libopengl0 libdrm-freedreno1 \
            xvfb xauth
          echo '--- toolchain ---'
          clang-21 --version
          ld.lld-21 --version | head -1
          echo '--- Mesa/Freedreno packages ---'
          mkdir -p logs
          {
            printf 'mesa_vulkan_drivers=%s\n' "$(dpkg-query -W -f='${Version}' mesa-vulkan-drivers 2>/dev/null || echo unknown)"
            printf 'libgl1_mesa_dri=%s\n' "$(dpkg-query -W -f='${Version}' libgl1-mesa-dri 2>/dev/null || echo unknown)"
            printf 'libdrm_freedreno1=%s\n' "$(dpkg-query -W -f='${Version}' libdrm-freedreno1 2>/dev/null || echo unknown)"
            printf 'mesa_ppa=%s\n' "${MESA_PPA_USED:-none}"
            echo '--- DRI modules ---'
            for directory in /usr/lib/aarch64-linux-gnu/dri /usr/local/lib/aarch64-linux-gnu/dri /usr/lib/dri /usr/lib64/dri; do
              [[ -d "$directory" ]] || continue
              find "$directory" -maxdepth 1 \( -type f -o -type l \) | \
                grep -E '/(msm|freedreno|kgsl)_dri\.so$' || true
            done
            echo '--- Vulkan ICDs ---'
            for directory in /usr/share/vulkan/icd.d /usr/local/share/vulkan/icd.d /etc/vulkan/icd.d; do
              [[ -d "$directory" ]] || continue
              find "$directory" -maxdepth 1 -type f | \
                grep -Ei '(freedreno|turnip).*icd.*json$' || true
            done
          } | tee logs/mesa-freedreno.log

      - name: Test proot and Freedreno launcher compatibility
        run: python3 verify-proot.py

      - name: Restore prepared source cache
        id: source-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: source
          key: blender-arm64-src-v3-${{ inputs.blender_version || 'latest' }}-${{ inputs.dependency_ref || 'auto' }}-${{ hashFiles('prepare-source.py', 'generate-dependency-manifest.cmake') }}

      - name: Recover cached Git worktrees
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          for repo in source source/lib/linux_arm64; do
            if [[ -e "$repo/.git" ]] && git -C "$repo" rev-parse --verify HEAD >/dev/null 2>&1; then
              git -C "$repo" reset --hard HEAD
            fi
          done

      - name: Resolve Blender source and ARM64 libraries
        id: source
        run: |
          mkdir -p logs
          ./prepare-source.sh 2>&1 | tee logs/prepare.log
          version=$(python3 -c 'import json; print(json.load(open("logs/build-info.json"))["version"])')
          os_id=$(. /etc/os-release; printf '%s%s' "$ID" "${VERSION_ID:-${VERSION_CODENAME:-unknown}}")
          echo "BLENDER_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "os_id=$os_id" >> "$GITHUB_OUTPUT"

      - name: Save prepared source cache
        if: always() && steps.source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: source
          key: ${{ steps.source-cache.outputs.cache-primary-key }}

      - name: Configure and build Blender
        run: ./build-blender.sh 2>&1 | tee logs/build-step.log

      - name: Verify CPU Cycles and software OpenGL
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 "$BLENDER_INSTALL_DIR/blender" \
            --gpu-backend opengl -noaudio --background --factory-startup \
            --python-exit-code 1 --python verify-build.py 2>&1 | tee logs/verify.log
          grep -q '^BUILD_VERIFIED ' logs/verify.log
          grep -q '^FEATURE_MATRIX_VERIFIED ' logs/verify.log
          grep -q '^BACKEND_MATRIX_VERIFIED ' logs/build-step.log
          python3 -c 'import json; assert json.load(open("logs/compile-flags.json"))["status"] == "PASS"'
          python3 -c 'import json; assert json.load(open("logs/prune-install.json"))["bytes_saved"] >= 0'

      - name: Probe Mesa Freedreno/Turnip and Vulkan
        run: |
          set +e
          vulkaninfo --summary > logs/vulkaninfo.log 2>&1
          vk_rc=$?
          timeout 120s xvfb-run -a -s '-screen 0 1280x720x24' \
            "$BLENDER_INSTALL_DIR/blender" --gpu-backend vulkan -noaudio \
            --factory-startup --python-exit-code 1 --python verify-vulkan.py \
            > logs/verify-vulkan.log 2>&1
          blender_rc=$?
          cat logs/verify-vulkan.log
          if [[ $vk_rc -ne 0 || $blender_rc -ne 0 ]] || ! grep -q '^VULKAN_VERIFIED ' logs/verify-vulkan.log; then
            echo '::warning::Vulkan probe did not pass. This is expected on a hosted runner without an Adreno/Freedreno GPU.'
          else
            echo 'Vulkan backend verified on this runner.'
          fi
          exit 0

      - name: Verify GUI startup with software OpenGL
        run: |
          timeout 120s xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 "$BLENDER_INSTALL_DIR/blender" \
            --gpu-backend opengl -noaudio --factory-startup \
            --python-exit-code 1 --python verify-ui.py 2>&1 | tee logs/verify-ui.log
          grep -q '^UI_VERIFIED ' logs/verify-ui.log

      - name: Package portable archive and source
        run: |
          ./package-release.sh
          {
            echo '### Linux ARM64 portable build complete'
            echo "Blender $BLENDER_VERSION, built on ${{ steps.source.outputs.os_id }} ARM64 with Clang 21 + ThinLTO."
            echo "CPU target: \`$BLENDER_CPU_FLAGS\` (SVE/SVE2 disabled)."
            echo 'Backends: CPU Cycles, Vulkan, OpenGL. CUDA, OptiX, HIP/HIPRT, oneAPI and binary GPU kernels are disabled.'
            echo 'Layout: bin/ + lib/blender/ + share/; .desktop and install-desktop.sh are included.'
            archive=$(find release -maxdepth 1 -name '*.tar.xz' ! -name '*-source.tar.xz' -print -quit)
            source_archive=$(find release -maxdepth 1 -name '*-source.tar.xz' -print -quit)
            install_bytes=$(python3 -c 'import json; print(json.load(open("logs/prune-install.json"))["bytes_after"])')
            echo "Install payload: $(numfmt --to=iec "$install_bytes")"
            echo "Portable archive: $(numfmt --to=iec "$(stat -c %s "$archive")")"
            echo "Source archive: $(numfmt --to=iec "$(stat -c %s "$source_archive")")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify extracted portable archive, desktop, proot and Freedreno
        run: |
          cd release
          sha256sum -c SHA256SUMS
          archive=$(find . -maxdepth 1 -name '*.tar.xz' ! -name '*-source.tar.xz' -print -quit)
          [[ -n "$archive" ]]
          cd ..
          tmp=$(mktemp -d)
          tar -xJf "release/$archive" -C "$tmp"
          root=$(find "$tmp" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -x "$root/bin/blender"
          test -x "$root/install-desktop.sh"
          test -f "$root/share/applications/blender-linux-arm64.desktop"
          desktop-file-validate "$root/share/applications/blender-linux-arm64.desktop"
          "$root/bin/blender" --version | tee logs/portable-version.log

          export HOME="$tmp/home"
          export XDG_CACHE_HOME="$tmp/cache"
          mkdir -p "$HOME" "$XDG_CACHE_HOME"

          xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 "$root/bin/blender" \
            --gpu-backend opengl -noaudio --background --factory-startup \
            --python-exit-code 1 --python verify-build.py 2>&1 | tee logs/portable-verify.log
          grep -q '^BUILD_VERIFIED ' logs/portable-verify.log
          grep -q '^FEATURE_MATRIX_VERIFIED ' logs/portable-verify.log

          timeout 120s xvfb-run -a -s '-screen 0 1280x720x24' \
            env -u LIBGL_ALWAYS_SOFTWARE "$root/bin/blender" \
            -noaudio --factory-startup --python-exit-code 1 \
            --python verify-ui.py 2>&1 | tee logs/portable-verify-ui.log
          grep -q '^UI_VERIFIED ' logs/portable-verify-ui.log

          "$root/install-desktop.sh" | tee logs/desktop-install.log
          desktop_file="$HOME/.local/share/applications/blender-linux-arm64.desktop"
          test -f "$desktop_file"
          desktop-file-validate "$desktop_file"
          grep -F "$root/bin/blender" "$desktop_file"

          cache_dir="$XDG_CACHE_HOME/blender-linux-arm64"
          cat "$cache_dir/proot.json" | tee logs/portable-proot.json
          cat "$cache_dir/freedreno.json" | tee logs/portable-freedreno.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: blender-${{ steps.source.outputs.version }}-${{ steps.source.outputs.os_id }}-arm64-portable
          path: release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${BLENDER_VERSION}-linux-arm64-cpu-vulkan-opengl-r${BLENDER_PACKAGE_REVISION}-a${GITHUB_RUN_ATTEMPT}"
          notes="$RUNNER_TEMP/blender-release-notes.md"
          {
            printf 'Blender %s for Linux ARM64 on Snapdragon 8s Gen 3.\n\n' "$BLENDER_VERSION"
            printf 'Clang 21 + LLD + ThinLTO with CPU Cycles, Vulkan and OpenGL. CUDA/OptiX/HIP/HIPRT/oneAPI backends and SVE/SVE2 are disabled.\n\n'
            printf 'Mesa Freedreno (msm DRI) and Turnip/Freedreno Vulkan ICD are detected automatically. Proot runtime/display/cache paths are repaired by the launcher. Validate `vulkaninfo --summary` on the device.\n\n'
            printf 'Download the portable `.tar.xz` and `SHA256SUMS`; extract it and run `bin/blender`, or run `install-desktop.sh` to add the desktop entry.\n\n'
            printf '[Build logs](%s/%s/actions/runs/%s).\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$notes"
          (cd release && sha256sum -c SHA256SUMS)
          gh release create "$tag" \
            release/*.tar.xz release/BUILD-INFO.json release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blender $BLENDER_VERSION — Linux ARM64 CPU/Vulkan/OpenGL" \
            --notes-file "$notes"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
          if-no-files-found: ignore
          retention-days: 14
